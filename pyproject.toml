[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-process-parser"
version = "1.1.0"
description = "Pipeline local de ingestão multissistema, motores determinísticos e narrativa jurídica rastreável em 29 ramos do Direito."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "COMMERCIAL_LICENSE.md"]
requires-python = ">=3.10"
authors = [{name = "Lucianum (lucianumm)"}]
dependencies = ["jsonschema>=4.23"]

[project.optional-dependencies]
review = ["jsonschema>=4.23"]
pdf = ["pypdf>=5.0", "pdf2image>=1.17", "Pillow>=10"]
ocr = ["pypdf>=5.0", "pdf2image>=1.17", "pytesseract>=0.3.13", "Pillow>=10"]

[project.scripts]
legal-process-parser = "scripts.ingest_document:main"
legal-process-context = "scripts.task_context:main"
legal-process-read = "scripts.case_packet:main"
legal-process-review = "scripts.legal_review:main"
legal-process-labor = "scripts.labor_analysis:main"
legal-process-labor-calc = "scripts.labor_calculations:main"
legal-process-client = "scripts.client_intake:main"
legal-process-labor-ledger = "scripts.labor_ledger:main"
legal-process-labor-catalog = "scripts.labor_catalog:main"
legal-process-thesis = "scripts.petition_workspace:main"
legal-process-events = "scripts.labor_events:main"
legal-process-labor-research = "scripts.labor_research:main"
legal-process-time-bank = "scripts.time_bank:main"
legal-process-response = "scripts.response_research:main"
legal-process-parameters = "scripts.labor_parameters:main"
legal-process-case-state = "scripts.labor_case_state:main"
legal-process-labor-time = "scripts.labor_time:main"
legal-process-citations = "scripts.citation_check:main"
legal-process-indices = "scripts.official_indices:main"
legal-process-legislation = "scripts.legislation_lookup:main"
legal-process-domain-catalog = "scripts.domain_catalog:main"
legal-process-claim-search = "scripts.claim_search:main"
legal-process-deadlines = "scripts.deadline_calculator:main"
legal-process-monetary = "scripts.civil_monetary_engine:main"
legal-process-previdenciario = "scripts.social_security_calc:main"
legal-process-penal-calc = "scripts.penal_dosimetry:main"
legal-process-limitation = "scripts.limitation_checker:main"
legal-process-datajud = "scripts.datajud_lookup:main"
legal-process-privacy = "scripts.privacy_redactor:main"
legal-process-docx = "scripts.docx_exporter:main"
legal-process-mcp = "scripts.mcp_server:main"
legal-process-cycle = "scripts.request_cycle:main"
legal-process-consistency = "scripts.global_consistency:main"
legal-process-catalog-status = "scripts.catalog_status:main"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "skills/legal-process-parser", "routing" = "routing"}
packages = ["scripts", "references", "schemas", "templates", "routing"]

[tool.setuptools.package-data]
references = ["*.json", "*.md", "labor_sectors/*.md", "labor_details/*.md", "domain_catalogs/*.json", "domain_catalogs/*.md", "domain_guides/*.md"]
schemas = ["*.json"]
templates = ["*.json", "*.md"]
routing = ["*.json"]

[tool.ruff]
target-version = "py310"
line-length = 160
extend-exclude = [".ci-artifacts", "dist", "build"]

[tool.ruff.lint]
# Correctness first (syntax, undefined names, unused imports/variables); style rules come later.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.ruff.lint.per-file-ignores]
# helpers.py is the compatibility facade: it re-exports names moved to smaller modules.
"skills/legal-process-parser/scripts/helpers.py" = ["F401"]
"skills/legal-process-parser/tests/*" = ["F401", "F841"]
"scripts/*" = []
